
django:
  replicaCount: 2

  image:
    repository: avinashkharate/django-app
    tag: latest
    pullPolicy: Always

  service:
    port: 8000


mysql:
  image:
    repository: mysql
    tag: "8.0"

  database: test_db
  user: root
  password: root

  service:
    port: 3306

  persistence:
    size: 5Gi


nginx:
  image:
    repository: nginx
    tag: latest
    pullPolicy: Always

  service:
    type: NodePort
    port: 80
    nodePort: 31796
