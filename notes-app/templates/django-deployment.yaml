apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-django

spec:
  replicas: {{ .Values.django.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Release.Name }}-django

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-django

    spec:
      containers:
        - name: django

          image: "{{ .Values.django.image.repository }}:{{ .Values.django.image.tag }}"

          imagePullPolicy: {{ .Values.django.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_USER

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_PORT

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: DB_HOST

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mysql-secret
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /admin
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /admin
              port: http

            initialDelaySeconds: 60
            periodSeconds: 20
